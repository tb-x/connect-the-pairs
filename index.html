<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Connect the Pairs</title>
<meta name="theme-color" content="#b0477a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Pairs">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" crossorigin="anonymous" href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js" crossorigin="anonymous"></script>
<style>
  /* Layout: maker mode is a settings card above a column of A4 sheet previews; each sheet prints in black and white as one wordless page of 1, 2 or 4 picture grids (a little "join the two" example top left and an answer QR code top right of each grid). Answer mode (the QR's #5x5.… link) is one grid on a card, with a coloured line drawing each pair's way. */
  :root{
    --ink:#1f2a44; --berry:#b0477a; --cream:#f7f1e3; --cream-dark:#e2d6b8;
    --go:#2fa34a; --red:#e0533d; --cell:#f3f4f7; --cell-line:#aab1c0;
    --read:Verdana,Tahoma,sans-serif;
    --title:'Luckiest Guy','Arial Rounded MT Bold','Trebuchet MS',system-ui,sans-serif;
    --z:1;
    color-scheme: light;
  }
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  html,body{margin:0}
  body{background:var(--berry);color:var(--ink);font-family:var(--read);-webkit-tap-highlight-color:transparent;
    -webkit-print-color-adjust:exact;print-color-adjust:exact}
  button,input,select{font:inherit;color:inherit;touch-action:manipulation}
  button{cursor:pointer}

  #home{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));left:calc(10px + env(safe-area-inset-left,0px));z-index:50;
    width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:#2a2140;background:rgba(255,255,255,.82);
    box-shadow:0 3px 0 rgba(0,0,0,.18);touch-action:manipulation;-webkit-tap-highlight-color:transparent;text-decoration:none}
  #home svg{width:24px;height:24px}
  #home:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.18)}

  /* ---------- maker ---------- */
  main{max-width:860px;margin:0 auto;
    padding:calc(12px + env(safe-area-inset-top,0px)) calc(12px + env(safe-area-inset-right,0px))
            calc(28px + env(safe-area-inset-bottom,0px)) calc(12px + env(safe-area-inset-left,0px))}
  header{padding-left:56px;min-height:44px;color:#fff}
  h1{font-family:var(--title);font-weight:400;font-size:clamp(30px,6vw,42px);letter-spacing:1px;line-height:1.1;margin:0;
    text-shadow:0 3px 0 rgba(0,0,0,.25)}
  header p{margin:6px 0 0;font-size:14px;line-height:1.45;opacity:.92}
  #controls{margin:16px 0 22px;background:var(--cream);border-radius:16px;padding:14px;box-shadow:0 4px 0 rgba(0,0,0,.2);
    display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px 14px}
  #controls label{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:bold}
  #controls input,#controls select{height:44px;width:100%;border:2px solid var(--cream-dark);border-radius:10px;background:#fff;
    padding:0 10px;font-size:16px}
  .btns{grid-column:1/-1;display:flex;gap:10px}
  .btns button{flex:1;height:54px;border:0;border-radius:14px;color:#fff;font-family:var(--title);font-size:clamp(18px,5.4vw,24px);letter-spacing:1px;white-space:nowrap;
    padding-top:4px;box-shadow:0 4px 0 rgba(0,0,0,.25)}
  .btns button:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.25)}
  #new{background:var(--red)}
  #print{background:var(--go)}

  #pages{display:flex;flex-direction:column;align-items:center;gap:22px}
  .page{position:relative}
  .reroll{position:absolute;bottom:8px;right:8px;width:44px;height:44px;border-radius:50%;border:0;background:var(--cream);
    box-shadow:0 3px 0 rgba(0,0,0,.2);display:grid;place-items:center;padding:0}
  .reroll svg{width:24px;height:24px}

  /* one printed A4 page; all sizes in mm so the preview is the print. --z shrinks the preview to fit a phone. */
  .sheet{zoom:var(--z);width:210mm;height:296.5mm;padding:12mm;background:#fff;overflow:hidden;
    display:grid;gap:8mm;box-shadow:0 6px 20px rgba(0,0,0,.3)}
  .slot{display:flex;align-items:center;justify-content:center;min-width:0;min-height:0}
  .slot svg{display:block}
  .pr .cell{fill:var(--cell);stroke:var(--cell-line)}
  .pr .box{fill:none;stroke:var(--ink)}
  .pr .eg{fill:none;stroke:var(--ink);stroke-linecap:round}
  .pr .under{fill:var(--cell)}
  .pr .route{fill:none;stroke-linecap:round;stroke-linejoin:round;
    animation:draw var(--d,1s) linear var(--s,0s) forwards}
  .pr .hop{transform-box:fill-box;transform-origin:50% 100%;animation:hop .45s ease-in-out var(--h,1s) 2}
  @keyframes draw{to{stroke-dashoffset:0}}
  @keyframes hop{50%{transform:translateY(-14%) scale(1.1)}}

  /* ---------- answer ---------- */
  #answer{min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;
    padding-top:calc(64px + env(safe-area-inset-top,0px))}
  .solved{width:min(100%,560px,calc(100dvh - 120px));background:#fff;border-radius:14px;padding:14px;box-shadow:0 6px 0 rgba(0,0,0,.2);
    display:flex;flex-direction:column;align-items:center;gap:12px}
  .solved svg{width:100%;height:auto;display:block;cursor:pointer}
  #make{color:var(--berry);font-size:14px}
  body.answering #maker, body:not(.answering) #answer{display:none}

  /* ---------- print: only the sheets, one per page ---------- */
  @page{size:A4 portrait;margin:0}
  @media print{
    body{background:#fff}
    #home,main>header,#controls,.reroll,#answer{display:none!important}
    main{padding:0;max-width:none}
    #pages{display:block}
    .sheet{zoom:1!important;box-shadow:none}
    .page:not(:last-child){break-after:page}
  }
</style>
</head>
<body>
<a id="home" href="../print.html" aria-label="All printables" title="All printables"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 11 12 4l8.5 7" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M6 9.8V20h12V9.8" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linejoin="round"/><path d="M10 20v-5.5h4V20" fill="currentColor"/></svg></a>

<main id="maker">
  <header>
    <h1>Connect the Pairs</h1>
    <p>Print a sheet of picture grids. Your child joins each pair of matching pictures with a line through the squares, going up, down, left or right, without lines crossing or sharing a square. Scan a grid's QR code to watch the answer.</p>
  </header>
  <form id="controls" onsubmit="return false">
    <label>Size <select id="size"></select></label>
    <label>Per page
      <select id="perPage"><option value="1">1</option><option value="2">2</option><option value="4">4</option></select>
    </label>
    <label>Pages <input id="sheets" type="number" inputmode="numeric"></label>
    <div class="btns"><button id="new" type="button">New puzzles</button><button id="print" type="button">Print</button></div>
  </form>
  <div id="pages"></div>
</main>

<main id="answer"><div id="solved" class="solved"></div></main>

<script>
/* ======== tuning ======== */
const DEFAULTS = { size: 5, perPage: 1, sheets: 1 };
const PAIRS = { 4: [3, 4], 5: [4, 5], 6: [5, 6], 7: [6, 8] };   // grid size (squares across) → fewest and most pairs
const MIN_LINE = 3;                  // fewest squares in one pair's line, counting both pictures
const BACKBITES = 20;                // shuffling moves per square when making the random path that fills the grid
const TRIES = 400;                   // fresh paths to try for one puzzle with exactly one answer
const SHEETS_MAX = 20;
const GRID = { 1: [1, 1], 2: [1, 2], 4: [2, 2] };   // grids per page → columns × rows (2 are stacked: the grids are square)
const MAX_CELL = 36;                 // mm, biggest square on the sheet
const PIC = 0.78;                    // a picture's size, as a share of its square
const QR_SIZE = { 1: 24, 2: 22, 4: 20 };   // mm, answer QR code by grids per page…
const QR_MODULE = 0.4;               // …grown if needed so each QR dot is at least this many mm, for a phone camera
const LINE_W = 0.3;                  // answer line thickness, as a share of a square
const DRAW_SPEED = 0.11;             // seconds per square while the answer page draws a line
const COLOURS = ['#e0533d', '#2f7de1', '#2fa34a', '#f29a1f', '#9b4dca', '#e84393', '#14a3a3', '#8a6d3b'];   // one per pair on the answer page
const PUBLIC_URL = 'https://tb-x.github.io/connect-the-pairs/';   // where the QR points when the maker isn't on GitHub Pages

/* ======== small helpers ======== */
const $ = (id) => document.getElementById(id);
const rint = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const shuffle = (a) => { for (let i = a.length - 1; i > 0; i--) { const j = rint(0, i); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const range = (n) => Array.from({ length: n }, (_, i) => i);
const f = (x) => +x.toFixed(2);

/* ======== settings (remembered per browser) ======== */
const KEY = 'pairs.settings';
let settings = { ...DEFAULTS };
try { Object.assign(settings, JSON.parse(localStorage.getItem(KEY)) || {}); } catch { /* blocked on file:// */ }
const saveSettings = () => { try { localStorage.setItem(KEY, JSON.stringify(settings)); } catch { /* ignore */ } };
const clamp = (v, a, b, d) => (Number.isFinite(+v) && v !== '' ? Math.min(b, Math.max(a, Math.round(+v))) : d);

/* ======== pictures ======== */
// Each is drawn in a 100 × 100 box centred on 0,0, as black lines on white, for a black-and-white printer
// (and so a child can colour them in). Every one has its own outline, so they're told apart at a glance.
const INK = '#1f2a44';
const STROKE = `fill="#fff" stroke="${INK}" stroke-width="5" stroke-linejoin="round"`;
const LINE = (w) => `fill="none" stroke="${INK}" stroke-width="${w}" stroke-linecap="round"`;
const starPath = () => range(10).map((i) => {
  const r = i % 2 ? 20 : 48, a = (i * 36 - 90) * Math.PI / 180;
  return `${i ? 'L' : 'M'}${f(r * Math.cos(a))} ${f(r * Math.sin(a) + 4)}`;
}).join('') + 'z';
const rays = range(8).map((k) => {
  const a = k * Math.PI / 4, c = Math.cos(a), si = Math.sin(a);
  return `M${f(31 * c)} ${f(31 * si)}L${f(45 * c)} ${f(45 * si)}`;
}).join('');
const petals = range(5).map((k) => {
  const a = (k * 72 - 90) * Math.PI / 180;
  return `<circle cx="${f(25 * Math.cos(a))}" cy="${f(25 * Math.sin(a) + 2)}" r="17" ${STROKE}/>`;
}).join('');

// the index is also the picture digit in the answer link, so only ever add to the end
const PICTURES = [
  `<path d="${rays}" stroke="${INK}" stroke-width="6" stroke-linecap="round"/><circle r="22" ${STROKE}/>`,   // sun
  `<path d="${starPath()}" ${STROKE}/>`,                                                                     // star
  `<path d="M0 40C-30 18-46 2-46-16-46-32-34-42-22-42-10-42-3-35 0-27 3-35 10-42 22-42 34-42 46-32 46-16 46 2 30 18 0 40z" ${STROKE}/>`,   // heart
  `<g transform="translate(2 0)"><path d="M-46-20-24 0-46 20z" ${STROKE}/><path d="M-24 0C-8-30 26-30 42 0 26 30-8 30-24 0z" ${STROKE}/>
    <circle cx="24" cy="-5" r="4.5" fill="${INK}"/></g>`,                                                     // fish
  `<path d="M0-20C-14-32-44-28-42 4-40 32-20 46 0 38 20 46 40 32 42 4 44-28 14-32 0-20z" ${STROKE}/>
    <path d="M0-20Q0-34 8-44" ${LINE(5)}/><path d="M5-32Q16-48 32-42 24-28 5-32z" ${STROKE}/>`,              // apple
  `${petals}<circle cy="2" r="14" ${STROKE}/>`,                                                               // flower
  `<path d="M24-38.6A41 41 0 1 0 24 38.6 43 43 0 0 1 24-38.6z" ${STROKE}/>`,                                // moon
  `<rect x="-30" y="-6" width="60" height="44" ${STROKE}/><path d="M-42-2 0-42 42-2z" ${STROKE}/>
    <rect x="-8" y="14" width="16" height="24" ${STROKE}/><rect x="14" y="2" width="11" height="11" ${STROKE}/>`,   // house
  `<path d="M-46 18V2L-34-2-20-24H16L30-2 44 2V18z" ${STROKE}/>
    <path d="M-17-18H-3V-3H-28z" ${STROKE}/><path d="M3-18H13L24-3H3z" ${STROKE}/>
    <circle cx="-25" cy="20" r="11" ${STROKE}/><circle cx="-25" cy="20" r="3.5" fill="${INK}"/>
    <circle cx="25" cy="20" r="11" ${STROKE}/><circle cx="25" cy="20" r="3.5" fill="${INK}"/>`,               // car
  `<rect x="-7" y="22" width="14" height="22" ${STROKE}/><path d="M0-46 30-8H14L38 26H-38L-14-8H-30z" ${STROKE}/>`,   // tree
];
const pic = (inner, x, y, s) => `<g transform="translate(${f(x)} ${f(y)}) scale(${f(s / 100)})">${inner}</g>`;

/* ======== puzzle: path, cut, solve ======== */
// The squares are numbered row by row, 0 … n² − 1. A puzzle is { n, ends: [[a, b], …], pics: [picture, …] }:
// pair k joins squares a and b and shows picture pics[k].
const nbCache = {};
// the squares next to each square (up, down, left, right)
function neighbours(n) {
  return (nbCache[n] ??= range(n * n).map((i) => {
    const r = Math.floor(i / n), c = i % n, out = [];
    if (r > 0) out.push(i - n);
    if (c < n - 1) out.push(i + 1);
    if (r < n - 1) out.push(i + n);
    if (c > 0) out.push(i - 1);
    return out;
  }));
}

// A random path through every square: start from a snake, then shuffle it with "backbite" moves (join one end to
// a square next to it further along the path and turn the loop that makes around; the other end stays put).
function fillingPath(n) {
  const nb = neighbours(n);
  let path = range(n).flatMap((r) => range(n).map((c) => r * n + (r % 2 ? n - 1 - c : c)));
  const at = new Int16Array(n * n);
  for (let m = BACKBITES * n * n; m > 0; m--) {
    if (Math.random() < 0.5) path.reverse();   // bite from the front end
    path.forEach((v, i) => { at[v] = i; });
    const opts = nb[path[0]].filter((v) => at[v] > 1);
    if (!opts.length) continue;
    const j = at[opts[rint(0, opts.length - 1)]];
    path = [...path.slice(0, j).reverse(), ...path.slice(j)];
  }
  return path;
}

// Cut the path into k lines of at least MIN_LINE squares, at random places; each line's two ends become a pair of
// pictures. A line never runs alongside itself (two of its squares side by side that aren't one step apart along
// it): such a line can nearly always be bent another way, and then the puzzle has more than one answer. The ends of
// a line aren't side by side either. Returns null when this path can't be cut like that.
function cutPath(path, k) {
  const N = path.length, n = Math.round(Math.sqrt(N)), nb = neighbours(n), at = new Int16Array(N);
  path.forEach((v, i) => { at[v] = i; });
  // last[s]: the furthest square a line starting at s can reach before it would run alongside itself
  const last = new Int16Array(N + 1).fill(N - 1);
  path.forEach((v, i) => { for (const w of nb[v]) if (at[w] > i + 1) last[i] = Math.min(last[i], at[w] - 1); });
  for (let i = N - 2; i >= 0; i--) last[i] = Math.min(last[i], last[i + 1]);
  const dead = new Set();   // (start, lines left) already known to fail
  const lines = [];
  const cut = (s, left) => {
    if (dead.has(s * 16 + left)) return false;
    const ends = left === 1 ? [N - 1] : shuffle(range(N).filter((e) => e >= s + MIN_LINE - 1 && e <= N - 1 - MIN_LINE * (left - 1)));
    for (const e of ends) {
      if (e > last[s] || e - s + 1 < MIN_LINE || touching(n, path[s], path[e])) continue;
      lines.push(path.slice(s, e + 1));
      if (left === 1 || cut(e + 1, left - 1)) return true;
      lines.pop();
    }
    dead.add(s * 16 + left);
    return false;
  };
  return cut(0, k) ? lines : null;
}

// Solve a puzzle where every square must be used: count the ways up to `limit`, and return them as lines of squares.
// Depth first, always growing the pair with the fewest moves; after each step give up when an empty square is a
// dead end, a pair's picture can't reach its partner any more, or a patch of empty squares can't be filled by a
// pair of its own (a line runs through one patch only, so each patch needs a different unfinished pair).
function solve(n, ends, limit = 2) {
  const N = n * n, K = ends.length, nb = neighbours(n);
  const own = new Int8Array(N).fill(-1), head = new Int16Array(K), tail = new Int16Array(K), done = new Uint8Array(K);
  const live = new Uint8Array(N), comp = new Int16Array(N), queue = new Int16Array(N);
  const lines = ends.map(([a]) => [a]), found = [];
  let empty = N;
  ends.forEach(([a, b], k) => { own[a] = own[b] = k; head[k] = a; tail[k] = b; empty -= 2; });

  function hopeful() {
    for (let k = 0; k < K; k++) if (!done[k]) live[head[k]] = live[tail[k]] = 1;
    let bad = false;
    for (let i = 0; i < N && !bad; i++) {   // every empty square needs two ways in or out
      if (own[i] >= 0) continue;
      let ways = 0;
      for (const j of nb[i]) if (own[j] < 0 || live[j]) ways++;
      if (ways < 2) bad = true;
    }
    for (let k = 0; k < K; k++) if (!done[k]) live[head[k]] = live[tail[k]] = 0;
    if (bad) return false;

    // patches of empty squares
    comp.fill(-1);
    let C = 0;
    for (let i = 0; i < N; i++) {
      if (own[i] >= 0 || comp[i] >= 0) continue;
      let qn = 0;
      queue[qn++] = i; comp[i] = C;
      for (let q = 0; q < qn; q++) for (const j of nb[queue[q]]) if (own[j] < 0 && comp[j] < 0) { comp[j] = C; queue[qn++] = j; }
      C++;
    }
    // which patches each unfinished pair could run through (touching both its ends)
    const can = [];
    for (let k = 0; k < K; k++) {
      if (done[k]) continue;
      const h = head[k], t = tail[k], hc = [], ok = [];
      for (const j of nb[h]) if (own[j] < 0 && !hc.includes(comp[j])) hc.push(comp[j]);
      for (const j of nb[t]) if (own[j] < 0 && hc.includes(comp[j]) && !ok.includes(comp[j])) ok.push(comp[j]);
      if (!ok.length && !nb[h].includes(t)) return false;   // cut off from its partner
      can.push(ok);
    }
    if (C > can.length) return false;
    // give every patch its own pair (a small matching)
    const by = new Int16Array(can.length).fill(-1);
    const patchPairs = range(C).map((c) => range(can.length).filter((p) => can[p].includes(c)));
    const take = (c, seen) => {
      for (const p of patchPairs[c]) {
        if (seen[p]) continue;
        seen[p] = 1;
        if (by[p] < 0 || take(by[p], seen)) { by[p] = c; return true; }
      }
      return false;
    };
    for (let c = 0; c < C; c++) if (!take(c, new Uint8Array(can.length))) return false;
    return true;
  }

  function step() {
    let best = -1, bestMoves = null;
    for (let k = 0; k < K; k++) {
      if (done[k]) continue;
      const moves = nb[head[k]].filter((j) => own[j] < 0 || j === tail[k]);
      if (!moves.length) return;
      if (!bestMoves || moves.length < bestMoves.length) { best = k; bestMoves = moves; if (moves.length === 1) break; }
    }
    if (best < 0) {   // every pair joined
      if (!empty) found.push(lines.map((l) => l.slice()));
      return;
    }
    const k = best, from = head[k];
    for (const j of bestMoves) {
      lines[k].push(j);
      if (j === tail[k]) {
        done[k] = 1;
        if (hopeful()) step();
        done[k] = 0;
      } else {
        own[j] = k; head[k] = j; empty--;
        if (hopeful()) step();
        own[j] = -1; head[k] = from; empty++;
      }
      lines[k].pop();
      if (found.length >= limit) return;
    }
  }
  if (hopeful()) step();
  return found;
}

// next to each other (then the line between them is just one step, too easy)
const touching = (n, a, b) => neighbours(n)[a].includes(b);

// a puzzle with exactly one answer, its pairs in random pictures; tries paths and cuts until one works
function makePuzzle(n) {
  const [lo, hi] = PAIRS[n], want = rint(lo, hi);   // fewer pairs are harder to cut, so stick to the count picked for a while
  for (let t = 0; t < TRIES; t++) {
    const lines = cutPath(fillingPath(n), t < TRIES / 2 ? want : rint(lo, hi));
    if (!lines) continue;
    const ends = lines.map((l) => [l[0], l.at(-1)]);
    if (solve(n, ends, 2).length !== 1) continue;
    const pics = shuffle(range(PICTURES.length)).slice(0, ends.length);
    return { n, ends, pics, lines };
  }
  return null;
}

/* ======== answer link and QR code ======== */
// #5x5.31207… : grid size, then five digits per pair: its picture, then its two squares (two digits each).
// Digits go into the QR code in its numeric mode, which packs them tightly.
const answerHash = (pz) => `#${pz.n}x${pz.n}.` + pz.ends.map(([a, b], k) => `${pz.pics[k]}${String(a).padStart(2, '0')}${String(b).padStart(2, '0')}`).join('');

// the puzzle in a link, or null if it isn't one (or has no answer)
function parsePuzzle(hash) {
  const p = /^#(\d)x(\d)\.((?:\d{5}){2,8})$/.exec(hash);
  if (!p || p[1] !== p[2] || !PAIRS[+p[1]]) return null;
  const n = +p[1], groups = p[3].match(/\d{5}/g);
  const pics = groups.map((g) => +g[0]), ends = groups.map((g) => [+g.slice(1, 3), +g.slice(3, 5)]);
  const cells = ends.flat();
  if (cells.some((i) => i >= n * n) || new Set(cells).size !== cells.length) return null;
  if (pics.some((v) => !PICTURES[v]) || new Set(pics).size !== pics.length) return null;
  const answers = solve(n, ends, 1);
  if (!answers.length) return null;
  return { n, ends, pics, lines: answers[0] };
}

const answerBase = () => (location.hostname.endsWith('github.io') ? location.origin + location.pathname : PUBLIC_URL);

// the QR code for an answer link: the address and the grid size as text, the pairs' digits as numbers
function qrFor(hash) {
  const q = qrcode(0, 'M'), cut = hash.indexOf('.') + 1;
  q.addData(answerBase() + hash.slice(0, cut));
  q.addData(hash.slice(cut), 'Numeric');
  q.make();
  return q;
}
// how many mm an n × n grid's QR code needs (made for the most pairs it can have)
const qrNeedCache = {};
function qrNeed(n) {
  if (typeof qrcode !== 'function') return 0;
  const k = PAIRS[n][1], pz = { n, ends: range(k).map(() => [0, 0]), pics: range(k) };
  return (qrNeedCache[n] ??= (qrFor(answerHash(pz)).getModuleCount() + 2) * QR_MODULE);
}

// the QR code as SVG, s mm square at x, y; on screen it's also a link to the answer
function qrSvg(hash, x, y, s) {
  if (typeof qrcode !== 'function') return '';   // library didn't load
  const q = qrFor(hash);
  const n = q.getModuleCount(), pad = 1, t = n + 2 * pad;
  let d = '';
  for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) if (q.isDark(r, c)) d += `M${c + pad} ${r + pad}h1v1h-1z`;
  return `<a href="${hash}" target="_blank"><g transform="translate(${f(x)} ${f(y)}) scale(${f(s / t)})">
    <rect width="${t}" height="${t}" fill="#fff"/><path d="${d}" fill="#000" shape-rendering="crispEdges"/></g></a>`;
}

/* ======== drawing one puzzle ======== */
const HEAD_GAP = 4;   // mm between the example and QR code row and the grid

// the biggest square that fits an n × n grid with a Q mm QR code above it into w × h mm
const cellSize = (n, w, h, Q) => Math.min(MAX_CELL, w / n, (h - Q - HEAD_GAP) / n);

// a wordless "join these two" example: two rings in a row of three squares, joined by a line (rings, not one of the
// pictures, so it isn't taken for part of the puzzle)
function exampleSvg(x, y, L) {
  const th = f(Math.max(0.25, L * 0.03));
  let s = '';
  for (let k = 0; k < 3; k++) s += `<rect class="cell" stroke-width="${th}" x="${f(x + k * L)}" y="${f(y)}" width="${f(L)}" height="${f(L)}"/>`;
  s += `<path class="eg" stroke-width="${f(L * 0.16)}" d="M${f(x + L / 2)} ${f(y + L / 2)}H${f(x + 2.5 * L)}"/>`;
  for (const k of [0, 2]) s += pic(`<circle r="26" fill="#fff" stroke="${INK}" stroke-width="8"/>`, x + (k + 0.5) * L, y + L / 2, L * PIC);
  return s;
}

// returns an <svg> sized in mm. opts: qr (answer QR code), answer (each pair's line drawn in colour, one after another)
function puzzleSvg(pz, c, opts) {
  const { n } = pz, gw = n * c, Q = opts.qr || 0, top = Q ? Q + HEAD_GAP : 0, th = Math.max(0.25, c * 0.02);
  let s = `<svg class="pr" width="${f(gw)}mm" height="${f(top + gw)}mm" viewBox="${f(-th)} ${f(-th)} ${f(gw + 2 * th)} ${f(top + gw + 2 * th)}" aria-hidden="true">`;
  if (Q) {
    s += exampleSvg(0, (Q - Math.min(Q * 0.6, c)) / 2, Math.min(Q * 0.6, c));
    s += qrSvg(answerHash(pz), gw - Q, 0, Q);
  }
  const X = (i) => (i % n + 0.5) * c, Y = (i) => top + (Math.floor(i / n) + 0.5) * c;
  for (let i = 0; i < n * n; i++) s += `<rect class="cell" stroke-width="${f(th)}" x="${f(X(i) - c / 2)}" y="${f(Y(i) - c / 2)}" width="${f(c)}" height="${f(c)}"/>`;
  s += `<rect class="box" stroke-width="${f(th * 3)}" x="0" y="${f(top)}" width="${f(gw)}" height="${f(gw)}" rx="${f(th * 2)}"/>`;

  // the answer: one line per pair, drawn in turn; its two pictures hop when it gets there
  const when = [];
  if (opts.answer) {
    let t = 0.5;
    pz.lines.forEach((line, k) => {
      const len = f((line.length - 1) * c + 1), d = f(line.length * DRAW_SPEED);
      s += `<path class="route" style="--s:${f(t)}s;--d:${d}s;stroke-dasharray:${len};stroke-dashoffset:${len}" stroke="${COLOURS[k % COLOURS.length]}"
        stroke-width="${f(c * LINE_W)}" d="M${line.map((i) => `${f(X(i))} ${f(Y(i))}`).join('L')}"/>`;
      t += +d + 0.15;
      when[k] = t;
    });
  }
  pz.ends.forEach(([a, b], k) => {
    for (const i of [a, b]) {
      const g = pic(PICTURES[pz.pics[k]], X(i), Y(i), c * PIC);
      // on the answer page a disc under the picture ends its line neatly at the picture's edge
      s += opts.answer ? `<g class="hop" style="--h:${f(when[k] - 0.15)}s"><circle class="under" cx="${f(X(i))}" cy="${f(Y(i))}" r="${f(c * 0.3)}"/>${g}</g>` : g;
    }
  });
  return s + '</svg>';
}

/* ======== maker: sheets ======== */
let pages = [];   // each page is a list of puzzles
const SHEET_W = 186, SHEET_H = 272.5, GAP = 8;   // mm inside the page margins

const slotSize = (perPage = settings.perPage) => {
  const [cols, rows] = GRID[perPage];
  return [(SHEET_W - (cols - 1) * GAP) / cols, (SHEET_H - (rows - 1) * GAP) / rows];
};
const qrSize = () => Math.max(QR_SIZE[settings.perPage], qrNeed(settings.size));
const makePage = () => range(settings.perPage).map(() => makePuzzle(settings.size)).filter(Boolean);

function sheetHtml(puzzles) {
  const [cols, rows] = GRID[settings.perPage], Q = qrSize(), c = cellSize(settings.size, ...slotSize(), Q);
  const slots = puzzles.map((pz) => `<div class="slot">${puzzleSvg(pz, c, { qr: Q })}</div>`).join('');
  return `<div class="sheet" style="grid-template-columns:repeat(${cols},1fr);grid-template-rows:repeat(${rows},1fr)">${slots}</div>`;
}

const REROLL = '<svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.6-5.9" fill="none" stroke="#1f2a44" stroke-width="2.6" stroke-linecap="round"/><path d="M20 3v6h-6" fill="none" stroke="#1f2a44" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>';

function renderPages() {
  $('pages').innerHTML = pages.map((pzs, i) => `<div class="page">${sheetHtml(pzs)}
    <button class="reroll" data-i="${i}" aria-label="New puzzles for this page" title="New puzzles for this page">${REROLL}</button></div>`).join('');
  fitPages();
}

// shrink the A4 previews to the screen width (print resets the zoom)
function fitPages() {
  const sheetPx = 210 * 96 / 25.4;
  document.documentElement.style.setProperty('--z', Math.min(1, $('pages').clientWidth / sheetPx).toFixed(3));
}

function readControls() {
  settings = {
    size: +$('size').value in PAIRS ? +$('size').value : DEFAULTS.size,
    perPage: +$('perPage').value in GRID ? +$('perPage').value : DEFAULTS.perPage,
    sheets: clamp($('sheets').value, 1, SHEETS_MAX, DEFAULTS.sheets),
  };
  writeControls();
  saveSettings();
}
function writeControls() {
  if (!(settings.size in PAIRS)) settings.size = DEFAULTS.size;
  if (!(settings.perPage in GRID)) settings.perPage = DEFAULTS.perPage;
  settings.sheets = clamp(settings.sheets, 1, SHEETS_MAX, DEFAULTS.sheets);
  for (const k of ['size', 'perPage', 'sheets']) $(k).value = settings[k];
  $('sheets').min = 1; $('sheets').max = SHEETS_MAX;
}

function newAll() { pages = range(settings.sheets).map(makePage); renderPages(); }

function startMaker() {
  $('size').innerHTML = Object.keys(PAIRS).map((n) => `<option value="${n}">${n} × ${n}</option>`).join('');
  writeControls();
  for (const k of ['size', 'perPage']) $(k).addEventListener('change', () => { readControls(); newAll(); });
  $('sheets').addEventListener('change', () => {   // keep the pages already made, add or drop at the end
    readControls();
    pages = pages.slice(0, settings.sheets);
    while (pages.length < settings.sheets) pages.push(makePage());
    renderPages();
  });
  $('new').addEventListener('click', () => { readControls(); newAll(); });
  $('print').addEventListener('click', () => { readControls(); window.print(); });
  $('pages').addEventListener('click', (e) => {
    const b = e.target.closest('.reroll');
    if (!b) return;
    pages[+b.dataset.i] = makePage();
    renderPages();
  });
  addEventListener('resize', fitPages);
  newAll();
}

/* ======== answer page ======== */
// the grid with each pair's line drawn in its own colour, one after another; tap it to draw again
function showAnswer(pz) {
  document.body.classList.add('answering');
  const draw = () => { $('solved').innerHTML = `${puzzleSvg(pz, 10, { answer: true })}<a id="make" href="./">Make new puzzles</a>`; };
  draw();
  $('solved').addEventListener('click', (e) => { if (e.target.closest('svg')) draw(); });
}

/* ======== start ======== */
function route() {
  const pz = parsePuzzle(location.hash);
  if (pz) showAnswer(pz);
  else { document.body.classList.remove('answering'); if (!pages.length) startMaker(); }
}
addEventListener('hashchange', () => location.reload());
route();
</script>
<script>
// Offline support: sw.js caches this page. Once the page has loaded, send it every file the page used (fonts,
// the QR library) so those work offline too. Fails quietly where unsupported, e.g. on file://.
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').then(() => navigator.serviceWorker.ready).then((reg) => {
    const send = () => reg.active && reg.active.postMessage({ cache: [location.href, ...performance.getEntriesByType('resource').map((r) => r.name)] });
    send(); setTimeout(send, 5000); setTimeout(send, 20000);
  }).catch(() => {});
  // When sw.js says a newer version of this page has just been downloaded, reload once to show it: straight away if
  // nobody has tapped or pressed a key yet, otherwise when the page comes back after 5+ minutes away, so a game in
  // progress is never lost. A timestamp in sessionStorage stops a second reload within 30 s.
  let started = false, newer = false, hiddenAt = 0;
  addEventListener('pointerdown', () => { started = true; }, true);
  addEventListener('keydown', () => { started = true; }, true);
  const reload = () => {
    const key = 'tbx-sw-reload:' + location.pathname;
    try { if (Date.now() - (+sessionStorage.getItem(key) || 0) < 30000) return; sessionStorage.setItem(key, Date.now()); } catch { return; }
    location.reload();
  };
  navigator.serviceWorker.addEventListener('message', (e) => { if (e.data && e.data.updated) { newer = true; if (!started) reload(); } });
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) hiddenAt = Date.now();
    else if (newer && hiddenAt && Date.now() - hiddenAt >= 5 * 60 * 1000) reload();
  });
}
</script>
</body>
</html>
